<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../icons/icon-96.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="../../manifest.json">
    <title>數字練習 (0-9)</title>
    <script src="../../js/config.js"></script>
    <script src="../../js/prevent-zoom.js" defer></script>
    <style>
        /* 數字練習（0–9）：遊戲本體在 js/number-practice.js（三關共用），這裡只有版面與主題色、資料 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body {
            height: 100vh; height: 100dvh; height: calc(var(--vh, 1vh) * 100);
            display: flex; flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            --np-c1: #667eea; --np-c2: #764ba2;
        }
        .nav-bar { flex-shrink: 0; background: rgba(255,255,255,0.95); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .back-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 24px; border-radius: 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .nav-title { font-weight: 800; color: #667eea; font-size: 1.15rem; }
        .score-display { font-size: 1.1rem; color: #667eea; font-weight: bold; text-align: center; }
        .score-label { font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="../index.html" class="back-btn">← 返回</a>
        <div class="nav-title">🔢 數字練習 0–9</div>
        <div class="score-display"><div class="score-label">得分</div><div id="npScore">0</div></div>
    </div>
    <main id="np"></main>

    <script src="../../js/speech-recognition.js"></script>
    <script src="../../js/speech-game.js"></script>
    <script src="../../js/number-practice.js"></script>
    <script>
        // 數字資料 (0-9)，含注音
        const NUMBERS = [
            { num: 0, zhuyin: 'ㄌㄧㄥˊ', text: '零' }, { num: 1, zhuyin: 'ㄧ', text: '一' }, { num: 2, zhuyin: 'ㄦˋ', text: '二' },
            { num: 3, zhuyin: 'ㄙㄢ', text: '三' }, { num: 4, zhuyin: 'ㄙˋ', text: '四' }, { num: 5, zhuyin: 'ㄨˇ', text: '五' },
            { num: 6, zhuyin: 'ㄌㄧㄡˋ', text: '六' }, { num: 7, zhuyin: 'ㄑㄧ', text: '七' }, { num: 8, zhuyin: 'ㄅㄚ', text: '八' },
            { num: 9, zhuyin: 'ㄐㄧㄡˇ', text: '九' }
        ];
        NumberPractice.start({ numbers: NUMBERS, storageKey: 'masteredNumbers_0_9', columns: 5, rounds: 10 });
    </script>
</body>
</html>
